# Project-level pytest configuration.
#
# Added in Phase 5 task T8 so CI and local pytest runs behave identically.
# Before this file, pytest's `utils.*` imports worked locally (by accident
# of pytest's rootdir+cwd path injection) but failed in GitHub Actions
# with `ModuleNotFoundError: No module named 'utils'`.

[tool.pytest.ini_options]

# Make the project root importable so `from utils.x import y` resolves
# from anywhere pytest is invoked. This is the single most important
# setting — without it CI collects most test files with import errors.
pythonpath = ["."]

# Single discovery root keeps `pytest` (no args) doing the right thing.
testpaths = ["tests"]

# PR #37 originally --ignored seven stale test files here to keep the CI
# bootstrap green. Phase 6.6 updated each to current behavior, so the
# whole suite is collected again. (6.7 had already moved test_llm.py and
# test_langchain.py to scripts/check_*.py.)
