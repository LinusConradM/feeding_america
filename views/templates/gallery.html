<div class="section-wrap gallery-section" id="gallery">
    <h2 class="section-title">Dashboard Gallery</h2>
    <p class="section-sub">Hover the navigation tabs or click below to preview each module</p>

    <div class="gallery-tabs">
        <a class="gtab active" href="/1_Executive_Overview" onmouseenter="switchGallery(this,'___IMG_OVERVIEW___','Executive Overview — National KPIs &amp; trend analysis')" onfocus="switchGallery(this,'___IMG_OVERVIEW___','Executive Overview — National KPIs &amp; trend analysis')">
            <i class="fas fa-chart-bar"></i> Overview
        </a>
        <a class="gtab" href="/2_Geographic_Intelligence"
            onmouseenter="switchGallery(this,'___IMG_MAP___','Geographic Intelligence — County-level choropleth maps')"
            onfocus="switchGallery(this,'___IMG_MAP___','Geographic Intelligence — County-level choropleth maps')">
            <i class="fas fa-map"></i> Geography
        </a>
        <button type="button" class="gtab"
            onclick="switchGallery(this,'___IMG_DATA___','Data Explorer — 47,000+ county-year observations')">
            <i class="fas fa-microscope"></i> Data Explorer
        </button>
        <button type="button" class="gtab"
            onclick="switchGallery(this,'___IMG_REGRESSION___','Regression Models — OLS, Ridge, LASSO, Random Forest')">
            <i class="fas fa-chart-line"></i> Regression
        </button>
        <button type="button" class="gtab"
            onclick="switchGallery(this,'___IMG_TIMELINE___','Time Series Explorer — SARIMAX &amp; trend forecasting')">
            <i class="fas fa-stream"></i> Time Series
        </button>
        <button type="button" class="gtab"
            onclick="switchGallery(this,'___IMG_CRITICAL___','Critical Path — Project workflow &amp; architecture')">
            <i class="fas fa-project-diagram"></i> Architecture
        </button>
    </div>

    <div class="gallery-frame">
        <div class="gallery-bar">
            <span class="dot-r"></span>
            <span class="dot-y"></span>
            <span class="dot-g"></span>
            <span style="font-family:'Geist Mono',monospace;font-size:0.72rem;color:#94a3b8;margin-left:0.5rem;"
                id="gallery-url">food-insecurity-analytics · streamlit</span>
        </div>
        <img id="gallery-img" src="___IMG_OVERVIEW___" alt="Dashboard preview" class="gallery-img" />
        <div class="gallery-caption" id="gallery-cap">Executive Overview — National KPIs &amp; trend analysis</div>
    </div>
</div>

<script>
    function switchGallery(btn, src, caption) {
        document.querySelectorAll('.gtab').forEach(function (t) { t.classList.remove('active'); });
        btn.classList.add('active');
        var img = document.getElementById('gallery-img');
        var cap = document.getElementById('gallery-cap');
        var url = document.getElementById('gallery-url');
        img.style.opacity = '0';
        setTimeout(function () {
            img.src = src;
            img.onload = function () { img.style.opacity = '1'; };
            cap.textContent = caption;
            url.textContent = 'food-insecurity-analytics · ' + btn.textContent.trim();
        }, 200);
    }
</script>
<div style="height:4rem"></div>
